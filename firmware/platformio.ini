; The test env is built only via `pio test -e native`; don't let `pio run`
; attempt to compile the Arduino sources against the host toolchain.
[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_ota.csv
board_build.filesystem = spiffs
board_build.flash_size = 8MB

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

build_src_flags =
    -Wall
    -Wextra
    -Wno-register
    -Wno-ignored-qualifiers

lib_deps =
    fastled/FastLED@3.9.0
    bblanchon/ArduinoJson@^7.0.0
    kosme/arduinoFFT@^2.0.0

[env:native]
platform = native
build_flags =
    -Isrc
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra